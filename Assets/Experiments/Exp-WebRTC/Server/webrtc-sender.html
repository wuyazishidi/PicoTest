<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Exp-WebRTC 测试发送端（SBS 双目鱼眼环回）</title>
<style>body{font-family:sans-serif;margin:16px} #log{white-space:pre-wrap;font-family:monospace;font-size:12px;background:#111;color:#0f0;padding:8px;height:180px;overflow:auto} canvas{border:1px solid #ccc;width:640px;height:180px}</style>
</head>
<body>
<h3>Exp-WebRTC 测试发送端</h3>
<p>信令：<input id="url" size="34" value="ws://127.0.0.1:8765"></p>
<p>
  <button id="connect">1) 连接信令</button>
  <button id="call" disabled>2) 开始呼叫（发 offer）</button>
  <button id="hangup" disabled>挂断</button>
</p>
<p>发送画面（SBS 2560×720：左半红/右半蓝 + 移动竖条）：</p>
<canvas id="cv" width="2560" height="720"></canvas>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(...a){ logEl.textContent += a.join(' ') + '\n'; logEl.scrollTop = logEl.scrollHeight; }

// ---- 生成 SBS 测试画面 ----
const cv = $('cv'), ctx = cv.getContext('2d');
let frame = 0;
function draw(){
  const w = cv.width, h = cv.height, half = w/2;
  ctx.fillStyle = '#c83028'; ctx.fillRect(0,0,half,h);      // 左眼：红
  ctx.fillStyle = '#2830c8'; ctx.fillRect(half,0,half,h);   // 右眼：蓝
  const x = (frame*8) % w;                                   // 移动竖条（验证动态刷新）
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x,0,20,h);
  ctx.fillStyle = '#000'; ctx.font='48px sans-serif';
  ctx.fillText('LEFT', 40, 80); ctx.fillText('RIGHT', half+40, 80);
  frame++;
  requestAnimationFrame(draw);
}
draw();
const stream = cv.captureStream(30);

// ---- 信令 + WebRTC ----
let ws, pc;
function send(o){ if (ws && ws.readyState===1) ws.send(JSON.stringify(o)); }

$('connect').onclick = () => {
  ws = new WebSocket($('url').value);
  ws.onopen = () => { log('[ws] connected'); $('call').disabled=false; };
  ws.onclose = () => { log('[ws] closed'); };
  ws.onerror = e => log('[ws] error');
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'answer') {
      log('[sig] <- answer');
      await pc.setRemoteDescription({ type:'answer', sdp:m.sdp });
    } else if (m.type === 'candidate') {
      try { await pc.addIceCandidate({ candidate:m.candidate, sdpMid:m.sdpMid, sdpMLineIndex:m.sdpMLineIndex }); } catch(e){ log('addIce err', e); }
    }
  };
};

$('call').onclick = async () => {
  pc = new RTCPeerConnection({ iceServers:[{ urls:'stun:stun.l.google.com:19302' }] });
  pc.onicecandidate = e => { if (e.candidate) send({ type:'candidate', candidate:e.candidate.candidate, sdpMid:e.candidate.sdpMid, sdpMLineIndex:e.candidate.sdpMLineIndex }); };
  pc.onconnectionstatechange = () => log('[pc]', pc.connectionState);
  for (const t of stream.getVideoTracks()) pc.addTrack(t, stream);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({ type:'offer', sdp: offer.sdp });
  log('[sig] -> offer');
  $('call').disabled=true; $('hangup').disabled=false;
};

$('hangup').onclick = () => { if(pc){pc.close();pc=null;} send({type:'bye'}); $('call').disabled=false; $('hangup').disabled=true; log('hangup'); };
</script>
</body>
</html>
